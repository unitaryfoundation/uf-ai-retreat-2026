name: validate-and-index
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate entries (warn only, never blocks a push)
        run: python3 scripts/validate.py || echo "::warning::validate.py reported problems; see the log"
      - name: Rebuild indexes
        run: python3 scripts/build_index.py
      - name: Commit regenerated indexes
        if: github.event_name == 'push'
        run: |
          git config user.name "retreat-index-bot"
          git config user.email "retreat-index-bot@users.noreply.github.com"
          git add -A '*INDEX.md'
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild indexes [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 3
            done
          fi
